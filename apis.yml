aid: unitlab-ai
name: Unitlab AI
description: >-
  Unitlab AI is an enterprise multimodal data annotation platform for AI
  teams, providing a unified workspace to label images, video, audio, text,
  documents, and medical (DICOM/NIfTI) data with AI-assisted auto-labeling
  (including Segment Anything), human review workflows, dataset versioning
  and releases, and bring-your-own-model integration. Programmatic access
  comes through the Unitlab SDK API at api.unitlab.ai, consumed by the
  official `unitlab` Python SDK and CLI on PyPI, authenticated with API keys.
  Backed by 500 Global.
